<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kopku - Form Bahan Baku</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">Kopku POS</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="produk.html">Produk</a>
      <a href="bahan_baku.html" class="active">Stok Bahan</a>
      <a href="index.html">Keluar</a>
    </nav>
  </aside>
  <main class="content">
    <header class="topbar">
      <span id="tanggal-waktu"></span>
      <span>Ayu Dewi &bull; Kasir</span>
    </header>
    <div class="page">
      <div class="page-head">
        <div>
          <h1>Tambah Bahan Baku</h1>
          <p class="muted">Isi data bahan mentah untuk membuat menu</p>
        </div>
      </div>
      <form class="form-card form-sempit form-validasi" novalidate>
        <div class="pesan"></div>
        <div class="form-group">
          <label for="nama">Nama bahan</label>
          <input type="text" id="nama" required placeholder="Contoh: Biji Kopi Arabika">
        </div>
        <div class="form-group">
          <label for="kategori">Kategori</label>
          <select id="kategori" required>
            <option value="">Pilih kategori</option>
            <option>Biji kopi</option>
            <option>Susu &amp; cairan</option>
            <option>Air &amp; es</option>
            <option>Sirup &amp; bubuk</option>
            <option>Kemasan</option>
          </select>
        </div>
        <div class="form-group">
          <label for="satuan">Satuan</label>
          <select id="satuan" required>
            <option value="">Pilih satuan</option>
            <option>gram</option><option>ml</option><option>liter</option><option>pcs</option>
          </select>
        </div>
        <div class="form-group">
          <label for="stok">Stok saat ini</label>
          <input type="number" id="stok" required min="0" placeholder="0">
        </div>
        <div class="form-group">
          <label for="minimum">Stok minimum (batas menipis)</label>
          <input type="number" id="minimum" required min="0" placeholder="0">
        </div>
        <div class="form-group">
          <label for="catatan">Catatan (opsional)</label>
          <textarea id="catatan" rows="2" placeholder="Contoh: dibeli dari pemasok A"></textarea>
        </div>
        <div class="aksi-form">
          <a href="bahan_baku.html" class="btn putih">Batal</a>
          <button type="submit" class="btn">Simpan</button>
        </div>
      </form>
    </div>
  </main>
</div>
<script src="assets/js/script.js"></script>
</body>
</html>
