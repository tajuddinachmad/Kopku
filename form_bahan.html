<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopku - Form Bahan Baku</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="navbar">
        <h2>Kopku Systems</h2>
        <div>
            <a href="bahan_baku.html">Kembali</a>
        </div>
    </div>

    <div class="container">
        <div class="form-card">
            <h2>Form Input Bahan Mentah</h2>
            <br>
            <form onsubmit="return validateForm()">
                <div class="form-group">
                    <label for="nama_bahan">Nama Bahan Baku:</label>
                    <input type="text" id="nama_bahan" placeholder="Misal: Gula Aren Liquid">
                </div>
                <div class="form-group">
                    <label for="kategori">Kategori:</label>
                    <select id="kategori">
                        <option>Biji Kopi</option>
                        <option>Bahan Cair</option>
                        <option>Sirup & Perasa</option>
                        <option>Packaging / Kemasan</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="jumlah_stok">Jumlah Stok Initial:</label>
                    <input type="number" step="0.1" id="jumlah_stok" placeholder="Misal: 10">
                </div>
                <div class="form-group">
                    <label for="satuan">Satuan Unit:</label>
                    <select id="satuan">
                        <option>Kg</option>
                        <option>Liter</option>
                        <option>Gram</option>
                        <option>Pcs</option>
                        <option>Botol</option>
                    </select>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Simpan Data</button>
            </form>
        </div>
    </div>
    <script src="assets/js/app.js"></script>
</body>
</html>
