<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kopku - Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
<div class="form-card login">
  <h2 class="judul-tengah">Login Kopku</h2>
  <form id="form-login" class="form-validasi" novalidate>
    <div class="pesan"></div>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" required placeholder="Masukkan username">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="Masukkan password">
    </div>
    <button type="submit" class="btn" style="width:100%">Masuk ke Sistem</button>
  </form>
</div>
<script src="js/script.js"></script>
</body>
</html>
