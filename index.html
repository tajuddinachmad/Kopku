<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopku - Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="form-card" style="margin-top: 80px;">
        <h2 style="text-align: center; margin-bottom: 20px;">Login Kopku</h2>
        <form action="index.html">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Masukkan password">
            </div>
            <button type="submit" class="btn" style="width: 100%;">Masuk ke Sistem</button>
        </form>
    </div>
</body>
</html>
