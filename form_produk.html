<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kopku - Form Produk</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">Kopku POS</div>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="produk.html" class="active">Produk</a>
      <a href="bahan_baku.html">Stok Bahan</a>
      <a href="index.html">Keluar</a>
    </nav>
  </aside>
  <main class="content">
    <header class="topbar">
      <span id="tanggal-waktu"></span>
      <span>Ayu Dewi &bull; Kasir</span>
    </header>
    <div class="page">
      <div class="page-head">
        <div>
          <h1>Tambah Produk</h1>
          <p class="muted">Lengkapi informasi menu yang akan dijual</p>
        </div>
      </div>
      <form class="form-card form-sempit form-validasi" novalidate>
        <div class="pesan"></div>
        <div class="form-group">
          <label for="nama">Nama produk</label>
          <input type="text" id="nama" required placeholder="Contoh: Kopi Susu Latte">
        </div>
        <div class="form-group">
          <label for="kategori">Kategori</label>
          <select id="kategori" required>
            <option value="">Pilih kategori</option>
            <option>Kopi</option><option>Nonkopi</option><option>Makanan</option>
          </select>
        </div>
        <div class="form-group">
          <label for="harga">Harga (Rp)</label>
          <input type="number" id="harga" required min="1" placeholder="0">
        </div>
        <div class="form-group">
          <label for="deskripsi">Deskripsi (opsional)</label>
          <textarea id="deskripsi" rows="3" placeholder="Tulis deskripsi singkat produk"></textarea>
        </div>
        <div class="aksi-form">
          <a href="produk.html" class="btn putih">Batal</a>
          <button type="submit" class="btn">Simpan</button>
        </div>
      </form>
    </div>
  </main>
</div>
<script src="assets/js/script.js"></script>
</body>
</html>
